# SonarQube Project Configuration for CGNS

# Project identification
sonar.projectKey=cgns
sonar.organization=CGNS

# Project metadata
sonar.projectName=CGNS
sonar.projectVersion=4.5

# Source code location
sonar.branch.name=develop
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclude build directories and third-party code
sonar.exclusions=\
  **/build*/**, \
  **/cbuild*/**, \
  **/hdf5*/**, \
  **/*.F90, \
  **/*.f90, \
  **/*.f, \
  **/*.for

# Test source location (if you want to analyze test code separately)
sonar.tests=src/tests,src/ptests

# C/C++ specific settings
sonar.cfamily.build-wrapper-output=${BUILD_WRAPPER_OUT_DIR}
sonar.cfamily.cache.enabled=true
sonar.cfamily.cache.path=.sonar/cfamily-cache
sonar.cfamily.threads=4

# Coverage settings (if you generate coverage reports)
# Uncomment and configure if you use gcov/lcov
# sonar.cfamily.gcov.reportsPath=coverage
# sonar.cfamily.llvm-cov.reportPath=coverage/coverage.json

# SCM settings
sonar.scm.provider=git

# Pull request decoration (for GitHub)
sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=CGNS/CGNS

# Additional analysis parameters
sonar.verbose=false
