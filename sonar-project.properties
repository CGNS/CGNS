# SonarQube Project Configuration for CGNS

# Project identification
sonar.projectKey=CGNS_CGNS
sonar.organization=cgns

# Project metadata
sonar.projectName=CGNS
sonar.projectVersion=4.5

# Source code location
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Exclude build directories, third-party code, Fortran files, and test programs
# NOTE: Test programs in src/tests and src/ptests are excluded because they are
# standalone executables that test the library, not part of the library source itself
sonar.exclusions=\
  src/tests/**,\
  src/ptests/**,\
  **/build*/**,\
  **/cbuild*/**,\
  **/hdf5*/**,\
  **/*.F90,\
  **/*.f90,\
  **/*.f,\
  **/*.for

# Don't set sonar.tests since test programs are excluded entirely
# (If you want to analyze test code quality, remove test paths from exclusions above
#  and uncomment the line below)
# sonar.tests=src/tests,src/ptests

# C/C++ specific settings
sonar.cfamily.cache.enabled=true
sonar.cfamily.cache.path=.sonar/cfamily-cache
sonar.cfamily.threads=4

# Coverage settings - using gcovr with SonarQube XML format
sonar.coverageReportPaths=cbuild/coverage.xml

# SCM settings
sonar.scm.provider=git

# Pull request decoration (for GitHub)
sonar.pullrequest.provider=GitHub
sonar.pullrequest.github.repository=CGNS/CGNS

# Additional analysis parameters
sonar.verbose=false
