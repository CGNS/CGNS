name: Windows

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build:
    strategy:
      matrix:
        hdf5_version: ["1.8.23", "1.14.3"]
        build_config:
          - opts: "-D CGNS_BUILD_SHARED:BOOL=OFF -D CGNS_USE_SHARED:BOOL=OFF -D CGNS_ENABLE_64BIT:BOOL=OFF"
            name: "static-32bit"
          - opts: "-D CGNS_BUILD_SHARED:BOOL=OFF -D CGNS_USE_SHARED:BOOL=OFF -D CGNS_ENABLE_64BIT:BOOL=ON"
            name: "static-64bit"
          - opts: "-D CGNS_BUILD_SHARED:BOOL=ON -D CGNS_USE_SHARED:BOOL=ON -D CGNS_ENABLE_64BIT:BOOL=ON"
            name: "shared-64bit"
        exclude:
          # Only test HDF5 1.8.23 with static-32bit config
          - hdf5_version: "1.8.23"
            build_config:
              name: "static-64bit"
          - hdf5_version: "1.8.23"
            build_config:
              name: "shared-64bit"

    name: Windows 2022 - HDF5 ${{ matrix.hdf5_version }} - ${{ matrix.build_config.name }}
    runs-on: windows-2022
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install HDF5 ${{ matrix.hdf5_version }}
        shell: pwsh
        run: |
          $hdf5_ver = "${{ matrix.hdf5_version }}"
          $shortgen = "vs17"

          # Determine HDF5 minor version for URL
          if ($hdf5_ver -like "1.8.*") {
            $minor = "1.8"
          } elseif ($hdf5_ver -like "1.10.*") {
            $minor = "1.10"
          } elseif ($hdf5_ver -like "1.14.*") {
            $minor = "1.14"
          }

          # Download HDF5 pre-built binary
          $url = "https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-${minor}/hdf5-${hdf5_ver}/bin/windows/hdf5-${hdf5_ver}-Std-win10_64-${shortgen}.zip"
          Write-Host "Downloading from: $url"

          New-Item -ItemType Directory -Path "hdf5-download" -Force
          Invoke-WebRequest -Uri $url -OutFile "hdf5-download/hdf5.zip"

          # Extract and install
          Write-Host "Extracting HDF5..."
          Expand-Archive -Path "hdf5-download/hdf5.zip" -DestinationPath "hdf5-download"
          $msiFile = Get-ChildItem -Path "hdf5-download" -Recurse -Filter "*.msi" | Select-Object -First 1

          Write-Host "Installing: $($msiFile.FullName)"
          Start-Process msiexec.exe -ArgumentList "/i", "$($msiFile.FullName)", "/quiet", "/qn", "/norestart", "/log", "install.log" -Wait

          # Display install log
          Get-Content install.log

          # Set environment variable
          echo "HDF5_DIR=C:\Program Files\HDF_Group\HDF5\${hdf5_ver}\cmake" >> $env:GITHUB_ENV

      - name: Configure CGNS
        shell: cmd
        run: |
          mkdir build
          cd build
          cmake --version
          cmake -G "Visual Studio 17 2022" -A x64 ^
            ${{ matrix.build_config.opts }} ^
            -D CMAKE_C_FLAGS:STRING="" ^
            -D CMAKE_BUILD_TYPE:STRING=Release ^
            -D HDF5_NEED_ZLIB:BOOL=ON ^
            -D CMAKE_STATIC_LINKER_FLAGS:STRING="" ^
            -D CGNS_ENABLE_HDF5:BOOL=ON ^
            -D CGNS_ENABLE_TESTS:BOOL=ON ^
            -D CGNS_ENABLE_LFS:BOOL=OFF ^
            -D CGNS_BUILD_CGNSTOOLS:BOOL=OFF ^
            -D CGNS_ENABLE_SCOPING:BOOL=OFF ^
            -D CGNS_ENABLE_FORTRAN:BOOL=OFF ^
            -D CGNS_ENABLE_PARALLEL:BOOL=OFF ^
            -D CMAKE_INSTALL_PREFIX:PATH="." ^
            ..

      - name: Build CGNS
        shell: cmd
        run: |
          cd build
          cmake --build . --config Release

      - name: Test CGNS
        shell: cmd
        run: |
          set PATH=%CD%\build\src\Release;%PATH%
          set PATH=C:\Program Files\HDF_Group\HDF5\${{ matrix.hdf5_version }}\bin;%PATH%
          cd build
          ctest -C Release --output-on-failure

      - name: Install CGNS
        shell: cmd
        run: |
          cd build
          cmake --install . --config Release
