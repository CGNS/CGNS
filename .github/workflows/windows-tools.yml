name: Windows CGNS Tools

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

env:
  hdf5_vers: 1.14.6
  hdf5_tag: hdf5_1.14.6

jobs:
  build:
    name: Windows Latest - CGNS Tools
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
    - name: Install Dependencies (Windows)
      run: |
        choco install magicsplat-tcl-tk -y
      shell: pwsh

    - name: Get Sources
      uses: actions/checkout@v4

    - name: Download HDF5 Binaries
      run: |
        $hdf5_url = "https://github.com/HDFGroup/hdf5/releases/download/${{ env.hdf5_tag }}/hdf5-${{ env.hdf5_vers }}-win-vs2022_cl.zip"
        Write-Host "Downloading HDF5 from: $hdf5_url"
        Invoke-WebRequest -Uri $hdf5_url -OutFile hdf5.zip
        Expand-Archive -Path hdf5.zip -DestinationPath hdf5_extract
        Write-Host "Extracted contents:"
        Get-ChildItem hdf5_extract -Recurse -Depth 2 | Select-Object FullName

        # Find the actual HDF5 directory (may be nested)
        $hdf5_dir = Get-ChildItem -Path hdf5_extract -Directory | Select-Object -First 1
        if ($hdf5_dir) {
          Move-Item $hdf5_dir.FullName $env:USERPROFILE\hdf5
        } else {
          # Files might be directly in extract folder
          Move-Item hdf5_extract $env:USERPROFILE\hdf5
        }

        # Find cmake config location
        $cmakeConfig = Get-ChildItem -Path $env:USERPROFILE\hdf5 -Recurse -Filter "hdf5-config.cmake" | Select-Object -First 1
        if ($cmakeConfig) {
          $hdf5CmakeDir = $cmakeConfig.DirectoryName
          Write-Host "Found HDF5 CMake config at: $hdf5CmakeDir"
          echo "HDF5_DIR=$hdf5CmakeDir" >> $env:GITHUB_ENV
        }
        echo "HDF5_ROOT=$env:USERPROFILE\hdf5" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Find Tcl/Tk Paths
      id: tcl_tk
      run: |
        # MagicSplat Tcl/Tk typically installs to C:\Program Files\Tcl
        $tclPath = "C:\Program Files\Tcl"
        if (-not (Test-Path $tclPath)) {
          # Try to find via command
          $tclsh = Get-Command tclsh -ErrorAction SilentlyContinue
          if ($tclsh) {
            $tclPath = $tclsh.Source | Split-Path | Split-Path
          }
        }
        echo "TCL_ROOT=$tclPath" >> $env:GITHUB_ENV
        echo "TK_ROOT=$tclPath" >> $env:GITHUB_ENV
        echo "Found Tcl/Tk at: $tclPath"
        Get-ChildItem "$tclPath\lib" -Filter "tcl*.lib" | Select-Object -First 1
        Get-ChildItem "$tclPath\lib" -Filter "tk*.lib" | Select-Object -First 1
      shell: pwsh

    - name: Configure CGNS
      run: |
        mkdir cbuild
        cd cbuild
        # Find Tcl/Tk library files dynamically (prefer non-stub versions)
        $tclLib = Get-ChildItem "$env:TCL_ROOT\lib" -Filter "tcl9*.lib" -Exclude "*stub*" | Select-Object -First 1 -ExpandProperty FullName
        if (-not $tclLib) {
          $tclLib = Get-ChildItem "$env:TCL_ROOT\lib" -Filter "tcl*.lib" | Select-Object -First 1 -ExpandProperty FullName
        }
        $tkLib = Get-ChildItem "$env:TK_ROOT\lib" -Filter "tk9*.lib" -Exclude "*stub*" | Select-Object -First 1 -ExpandProperty FullName
        if (-not $tkLib) {
          $tkLib = Get-ChildItem "$env:TK_ROOT\lib" -Filter "tk*.lib" | Select-Object -First 1 -ExpandProperty FullName
        }
        Write-Host "Using TCL_LIBRARY: $tclLib"
        Write-Host "Using TK_LIBRARY: $tkLib"

        cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCGNS_ENABLE_FORTRAN=OFF -DCGNS_ENABLE_HDF5=ON -DHDF5_DIR="$env:HDF5_DIR" -DHDF5_NEED_ZLIB=OFF -DHDF5_NEED_SZIP=OFF -DCGNS_BUILD_CGNSTOOLS=ON -DTCL_LIBRARY="$tclLib" -DTK_LIBRARY="$tkLib" -DTCL_INCLUDE_PATH="$env:TCL_ROOT\include" -DTK_INCLUDE_PATH="$env:TK_ROOT\include" -DCGNS_ENABLE_TESTS=ON -DCMAKE_INSTALL_PREFIX=install ..
      shell: pwsh

    - name: Build CGNS
      run: |
        cd cbuild
        cmake --build . --config Release --parallel 4
      shell: pwsh

    - name: Test CGNS Tools Build
      run: |
        cd cbuild
        if (Test-Path "src/cgnstools/cgnsview/Release/cgiowish.exe") {
          Write-Host "✓ cgnsview built successfully"
        } else {
          Write-Host "✗ cgnsview build failed"
          exit 1
        }
        if (Test-Path "src/cgnstools/tkogl/Release/tkogl.lib") {
          Write-Host "✓ tkogl built successfully (library)"
        } else {
          Write-Host "Note: tkogl not built as separate library"
        }
      shell: pwsh

    - name: Run Tests
      run: |
        cd cbuild
        ctest -C Release -VV --output-on-failure
      shell: pwsh

    - name: Install CGNS
      run: |
        cd cbuild
        cmake --install . --config Release
      shell: pwsh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cgns-windows-tools
        path: cbuild/install
