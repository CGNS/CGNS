name: Windows CGNS Tools

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

env:
  hdf5_vers: 1.14.6
  hdf5_tag: hdf5_1.14.6

jobs:
  build:
    name: Windows Latest - CGNS Tools
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
    - name: Install Dependencies (Windows)
      run: |
        choco install magicsplat-tcl-tk -y
      shell: pwsh

    - name: Get Sources
      uses: actions/checkout@v4

    - name: Download HDF5 Binaries
      run: |
        $hdf5_url = "https://github.com/HDFGroup/hdf5/releases/download/${{ env.hdf5_tag }}/hdf5-${{ env.hdf5_vers }}-win-vs2022_cl.zip"
        Write-Host "Downloading HDF5 from: $hdf5_url"
        Invoke-WebRequest -Uri $hdf5_url -OutFile hdf5.zip
        Expand-Archive -Path hdf5.zip -DestinationPath hdf5_extract

        Write-Host "=== Extracted archive contents ==="
        Get-ChildItem hdf5_extract | Select-Object Name, PSIsContainer | Format-Table -AutoSize

        # Find the actual HDF5 directory (look for HDF5-* pattern, case-insensitive)
        $hdf5_dir = Get-ChildItem -Path hdf5_extract -Directory | Where-Object { $_.Name -like "HDF5-*" -or $_.Name -like "hdf5-*" } | Select-Object -First 1

        if ($hdf5_dir) {
          Write-Host "Found HDF5 directory: $($hdf5_dir.FullName)"
          Move-Item $hdf5_dir.FullName $env:USERPROFILE\hdf5
        } else {
          Write-Host "No HDF5 subdirectory found, using extract folder directly"
          # Files might be directly in extract folder
          Move-Item hdf5_extract $env:USERPROFILE\hdf5
        }

        Write-Host "=== HDF5 final installation directory ==="
        Get-ChildItem $env:USERPROFILE\hdf5 -Recurse -Depth 3 | Where-Object { $_.PSIsContainer -or $_.Extension -eq ".cmake" -or $_.Extension -eq ".lib" -or $_.Extension -eq ".h" } | Select-Object FullName | Format-Table -AutoSize

        Write-Host "=== Searching for CMake config files ==="
        $cmakeConfigs = Get-ChildItem $env:USERPROFILE\hdf5 -Recurse -Filter "*.cmake" -ErrorAction SilentlyContinue
        if ($cmakeConfigs) {
          $cmakeConfigs | ForEach-Object { Write-Host $_.FullName }

          # Find the cmake directory containing hdf5-config.cmake
          $hdf5ConfigFile = $cmakeConfigs | Where-Object { $_.Name -like "*hdf5*config.cmake" } | Select-Object -First 1
          if ($hdf5ConfigFile) {
            $hdf5CmakeDir = $hdf5ConfigFile.DirectoryName
            Write-Host "Found HDF5 CMake config at: $hdf5CmakeDir"
            echo "HDF5_DIR=$hdf5CmakeDir" >> $env:GITHUB_ENV
          }
        } else {
          Write-Host "No cmake files found at all"
        }

        # Always set fallback paths
        Write-Host "=== Setting fallback include/lib paths ==="
        $hdf5IncludeDir = Get-ChildItem -Path $env:USERPROFILE\hdf5 -Recurse -Directory -Filter "include" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
        $hdf5LibDir = Get-ChildItem -Path $env:USERPROFILE\hdf5 -Recurse -Directory -Filter "lib" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName

        if ($hdf5LibDir) {
          $hdf5Lib = Get-ChildItem -Path $hdf5LibDir -Filter "hdf5.lib" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $hdf5Lib) {
            $hdf5Lib = Get-ChildItem -Path $hdf5LibDir -Filter "libhdf5.lib" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
        }

        Write-Host "HDF5_INCLUDE_DIR: $hdf5IncludeDir"
        Write-Host "HDF5_LIBRARY: $hdf5Lib"

        echo "HDF5_ROOT=$env:USERPROFILE\hdf5" >> $env:GITHUB_ENV
        if ($hdf5IncludeDir) { echo "HDF5_INCLUDE_DIR=$hdf5IncludeDir" >> $env:GITHUB_ENV }
        if ($hdf5Lib) { echo "HDF5_LIBRARY=$hdf5Lib" >> $env:GITHUB_ENV }
      shell: pwsh

    - name: Debug HDF5 Installation
      run: |
        Write-Host "=== Checking HDF5 installation ==="
        Write-Host "HDF5_ROOT: $env:HDF5_ROOT"
        Write-Host "HDF5_DIR: $env:HDF5_DIR"
        Write-Host "HDF5_INCLUDE_DIR: $env:HDF5_INCLUDE_DIR"
        Write-Host "HDF5_LIBRARY: $env:HDF5_LIBRARY"

        if (Test-Path $env:HDF5_ROOT) {
          Write-Host "HDF5_ROOT exists, listing contents:"
          Get-ChildItem $env:HDF5_ROOT | Select-Object Name, PSIsContainer

          Write-Host "`nChecking for cmake directory:"
          if (Test-Path "$env:HDF5_ROOT\cmake") {
            Get-ChildItem "$env:HDF5_ROOT\cmake" | Select-Object Name
          }

          Write-Host "`nChecking for include directory:"
          if (Test-Path "$env:HDF5_ROOT\include") {
            Get-ChildItem "$env:HDF5_ROOT\include" -Filter "*.h" | Select-Object -First 5 Name
          }

          Write-Host "`nChecking for lib directory:"
          if (Test-Path "$env:HDF5_ROOT\lib") {
            Get-ChildItem "$env:HDF5_ROOT\lib" -Filter "*.lib" | Select-Object Name
          }
        } else {
          Write-Host "ERROR: HDF5_ROOT does not exist!"
        }
      shell: pwsh

    - name: Find Tcl/Tk Paths
      id: tcl_tk
      run: |
        # MagicSplat Tcl/Tk typically installs to C:\Program Files\Tcl
        $tclPath = "C:\Program Files\Tcl"
        if (-not (Test-Path $tclPath)) {
          # Try to find via command
          $tclsh = Get-Command tclsh -ErrorAction SilentlyContinue
          if ($tclsh) {
            $tclPath = $tclsh.Source | Split-Path | Split-Path
          }
        }
        echo "TCL_ROOT=$tclPath" >> $env:GITHUB_ENV
        echo "TK_ROOT=$tclPath" >> $env:GITHUB_ENV
        echo "Found Tcl/Tk at: $tclPath"
        Get-ChildItem "$tclPath\lib" -Filter "tcl*.lib" | Select-Object -First 1
        Get-ChildItem "$tclPath\lib" -Filter "tk*.lib" | Select-Object -First 1
      shell: pwsh

    - name: Configure CGNS
      run: |
        mkdir cbuild
        cd cbuild
        # Find Tcl/Tk library files dynamically (prefer non-stub versions)
        $tclLib = Get-ChildItem "$env:TCL_ROOT\lib" -Filter "tcl9*.lib" -Exclude "*stub*" | Select-Object -First 1 -ExpandProperty FullName
        if (-not $tclLib) {
          $tclLib = Get-ChildItem "$env:TCL_ROOT\lib" -Filter "tcl*.lib" | Select-Object -First 1 -ExpandProperty FullName
        }
        $tkLib = Get-ChildItem "$env:TK_ROOT\lib" -Filter "tk9*.lib" -Exclude "*stub*" | Select-Object -First 1 -ExpandProperty FullName
        if (-not $tkLib) {
          $tkLib = Get-ChildItem "$env:TK_ROOT\lib" -Filter "tk*.lib" | Select-Object -First 1 -ExpandProperty FullName
        }
        Write-Host "Using TCL_LIBRARY: $tclLib"
        Write-Host "Using TK_LIBRARY: $tkLib"

        # Build CMake command with HDF5_DIR if available, otherwise use include/lib paths
        if ($env:HDF5_DIR) {
          Write-Host "Using HDF5_DIR: $env:HDF5_DIR"
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCGNS_ENABLE_FORTRAN=OFF -DCGNS_ENABLE_HDF5=ON -DHDF5_DIR="$env:HDF5_DIR" -DHDF5_NEED_ZLIB=OFF -DHDF5_NEED_SZIP=OFF -DCGNS_BUILD_CGNSTOOLS=ON -DTCL_LIBRARY="$tclLib" -DTK_LIBRARY="$tkLib" -DTCL_INCLUDE_PATH="$env:TCL_ROOT\include" -DTK_INCLUDE_PATH="$env:TK_ROOT\include" -DCGNS_ENABLE_TESTS=ON -DCMAKE_INSTALL_PREFIX=install ..
        } else {
          Write-Host "Using HDF5_INCLUDE_DIR and HDF5_LIBRARY"
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCGNS_ENABLE_FORTRAN=OFF -DCGNS_ENABLE_HDF5=ON -DHDF5_INCLUDE_DIR="$env:HDF5_INCLUDE_DIR" -DHDF5_LIBRARY="$env:HDF5_LIBRARY" -DHDF5_NEED_ZLIB=OFF -DHDF5_NEED_SZIP=OFF -DCGNS_BUILD_CGNSTOOLS=ON -DTCL_LIBRARY="$tclLib" -DTK_LIBRARY="$tkLib" -DTCL_INCLUDE_PATH="$env:TCL_ROOT\include" -DTK_INCLUDE_PATH="$env:TK_ROOT\include" -DCGNS_ENABLE_TESTS=ON -DCMAKE_INSTALL_PREFIX=install ..
        }
      shell: pwsh

    - name: Build CGNS
      run: |
        cd cbuild
        cmake --build . --config Release --parallel 4
      shell: pwsh

    - name: Test CGNS Tools Build
      run: |
        cd cbuild
        if (Test-Path "src/cgnstools/cgnsview/Release/cgiowish.exe") {
          Write-Host "✓ cgnsview built successfully"
        } else {
          Write-Host "✗ cgnsview build failed"
          exit 1
        }
        if (Test-Path "src/cgnstools/tkogl/Release/tkogl.lib") {
          Write-Host "✓ tkogl built successfully (library)"
        } else {
          Write-Host "Note: tkogl not built as separate library"
        }
      shell: pwsh

    - name: Run Tests
      run: |
        cd cbuild
        ctest -C Release -VV --output-on-failure
      shell: pwsh

    - name: Install CGNS
      run: |
        cd cbuild
        cmake --install . --config Release
      shell: pwsh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cgns-windows-tools
        path: cbuild/install
