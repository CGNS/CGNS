name: Windows CGNS Tools

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]

env:
  hdf5_vers: 1.14.6
  hdf5_tag: hdf5_1.14.6

jobs:
  build:
    name: Windows Latest - CGNS Tools
    runs-on: windows-latest
    if: "!contains(github.event.head_commit.message, 'skip-ci')"

    steps:
    - name: Get Sources
      uses: actions/checkout@v4

    - name: Build Tcl/Tk from Source with Private Headers
      run: |
        $ErrorActionPreference = "Stop"

        # Define versions
        $tclVersion = "8.6.15"
        $tkVersion = "8.6.15"
        $tclTag = "core-8-6-15"
        $tkTag = "core-8-6-15"

        # Create build directory
        $buildRoot = "$env:TEMP\tcltk_build"
        New-Item -Path $buildRoot -ItemType Directory -Force | Out-Null
        $installDir = "C:\tcltk"
        New-Item -Path $installDir -ItemType Directory -Force | Out-Null

        Write-Host "=== Downloading Tcl source ==="
        # Download official release tarballs from SourceForge
        # Using curl which handles SourceForge redirects better than Invoke-WebRequest
        $tclUrl = "https://sourceforge.net/projects/tcl/files/Tcl/$tclVersion/tcl$tclVersion-src.tar.gz/download"
        Write-Host "Downloading from: $tclUrl"
        curl -L -o "$buildRoot\tcl.tar.gz" $tclUrl
        if ($LASTEXITCODE -ne 0) { throw "Failed to download Tcl" }

        # Verify download
        $tclFile = Get-Item "$buildRoot\tcl.tar.gz"
        Write-Host "Downloaded file size: $($tclFile.Length) bytes"
        if ($tclFile.Length -lt 1000000) {
            Write-Host "ERROR: Downloaded file too small (expected ~10MB), got HTML redirect page"
            Get-Content "$buildRoot\tcl.tar.gz" -Raw | Select-Object -First 500
            throw "Tcl download failed"
        }

        # Extract tar.gz on Windows using tar command (available in Windows 10+)
        Write-Host "Extracting Tcl tarball..."
        Push-Location $buildRoot
        tar -xzf tcl.tar.gz
        if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "Failed to extract Tcl tarball"
        }
        Pop-Location

        Write-Host "=== Downloading Tk source ==="
        $tkUrl = "https://sourceforge.net/projects/tcl/files/Tcl/$tkVersion/tk$tkVersion-src.tar.gz/download"
        Write-Host "Downloading from: $tkUrl"
        curl -L -o "$buildRoot\tk.tar.gz" $tkUrl
        if ($LASTEXITCODE -ne 0) { throw "Failed to download Tk" }

        # Verify download
        $tkFile = Get-Item "$buildRoot\tk.tar.gz"
        Write-Host "Downloaded file size: $($tkFile.Length) bytes"
        if ($tkFile.Length -lt 1000000) {
            Write-Host "ERROR: Downloaded file too small (expected ~4MB), got HTML redirect page"
            Get-Content "$buildRoot\tk.tar.gz" -Raw | Select-Object -First 500
            throw "Tk download failed"
        }

        Write-Host "Extracting Tk tarball..."
        Push-Location $buildRoot
        tar -xzf tk.tar.gz
        if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "Failed to extract Tk tarball"
        }
        Pop-Location

        # Setup MSVC environment
        $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        $vcvarsall = "$vsPath\VC\Auxiliary\Build\vcvarsall.bat"

        Write-Host "=== Building Tcl ==="
        $tclSrcDir = Get-ChildItem -Path $buildRoot -Directory -Filter "tcl-*" | Select-Object -First 1
        Push-Location "$($tclSrcDir.FullName)\win"

        # Build Tcl
        cmd /c "`"$vcvarsall`" x64 && nmake -f makefile.vc INSTALLDIR=$installDir release"
        if ($LASTEXITCODE -ne 0) { throw "Tcl build failed" }

        # Install Tcl
        cmd /c "`"$vcvarsall`" x64 && nmake -f makefile.vc INSTALLDIR=$installDir install"
        if ($LASTEXITCODE -ne 0) { throw "Tcl install failed" }

        # Install Tcl private headers
        cmd /c "`"$vcvarsall`" x64 && nmake -f makefile.vc INSTALLDIR=$installDir install-private-headers"
        Write-Host "Tcl private headers install completed (exit code: $LASTEXITCODE)"

        Pop-Location

        Write-Host "=== Building Tk ==="
        $tkSrcDir = Get-ChildItem -Path $buildRoot -Directory -Filter "tk-*" | Select-Object -First 1
        Push-Location "$($tkSrcDir.FullName)\win"

        # Build Tk
        cmd /c "`"$vcvarsall`" x64 && nmake -f makefile.vc TCLDIR=$($tclSrcDir.FullName) INSTALLDIR=$installDir release"
        if ($LASTEXITCODE -ne 0) { throw "Tk build failed" }

        # Install Tk
        cmd /c "`"$vcvarsall`" x64 && nmake -f makefile.vc TCLDIR=$($tclSrcDir.FullName) INSTALLDIR=$installDir install"
        if ($LASTEXITCODE -ne 0) { throw "Tk install failed" }

        # Install Tk private headers
        cmd /c "`"$vcvarsall`" x64 && nmake -f makefile.vc TCLDIR=$($tclSrcDir.FullName) INSTALLDIR=$installDir install-private-headers"
        Write-Host "Tk private headers install completed (exit code: $LASTEXITCODE)"

        Pop-Location

        Write-Host "=== Verifying installation ==="
        Write-Host "Tcl/Tk installed to: $installDir"
        Get-ChildItem $installDir | Select-Object Name, PSIsContainer

        Write-Host "`nChecking for private headers:"
        $tclIntPath = Get-ChildItem -Path "$installDir\include" -Filter "tclInt.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $tkIntPath = Get-ChildItem -Path "$installDir\include" -Filter "tkInt.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
        $tkWinIntPath = Get-ChildItem -Path "$installDir\include" -Filter "tkWinInt.h" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1

        if ($tclIntPath) { Write-Host "✓ Found tclInt.h at: $($tclIntPath.FullName)" }
        if ($tkIntPath) { Write-Host "✓ Found tkInt.h at: $($tkIntPath.FullName)" }
        if ($tkWinIntPath) { Write-Host "✓ Found tkWinInt.h at: $($tkWinIntPath.FullName)" }

        # Set environment variable for later steps
        echo "TCL_ROOT=$installDir" >> $env:GITHUB_ENV
        echo "TK_ROOT=$installDir" >> $env:GITHUB_ENV
      shell: pwsh

    - name: Download HDF5 Binaries
      run: |
        $ErrorActionPreference = "Stop"

        $hdf5_url = "https://github.com/HDFGroup/hdf5/releases/download/${{ env.hdf5_tag }}/hdf5-${{ env.hdf5_vers }}-win-vs2022_cl.zip"
        Write-Host "Downloading HDF5 from: $hdf5_url"

        try {
          Invoke-WebRequest -Uri $hdf5_url -OutFile hdf5.zip
          Write-Host "Download complete. File size: $((Get-Item hdf5.zip).Length) bytes"
        } catch {
          Write-Host "ERROR: Failed to download HDF5: $_"
          exit 1
        }

        try {
          Expand-Archive -Path hdf5.zip -DestinationPath hdf5_extract -Force
          Write-Host "First extraction complete"
        } catch {
          Write-Host "ERROR: Failed to extract HDF5: $_"
          exit 1
        }

        Write-Host "=== First extraction contents ==="
        Get-ChildItem hdf5_extract | Select-Object Name, PSIsContainer | Format-Table -AutoSize

        # Check for nested zip file (search recursively)
        $innerZip = Get-ChildItem -Path hdf5_extract -Filter "*.zip" -Recurse | Select-Object -First 1
        if ($innerZip) {
          Write-Host "Found nested zip file: $($innerZip.FullName), extracting..."
          try {
            Expand-Archive -Path $innerZip.FullName -DestinationPath hdf5_final -Force
            Write-Host "Second extraction complete"
          } catch {
            Write-Host "ERROR: Failed to extract nested zip: $_"
            exit 1
          }

          Write-Host "=== Final extracted contents ==="
          Get-ChildItem hdf5_final | Select-Object Name, PSIsContainer | Format-Table -AutoSize

          # Find the HDF5 directory in final extraction
          $hdf5_dir = Get-ChildItem -Path hdf5_final -Directory | Select-Object -First 1

          if ($hdf5_dir) {
            Write-Host "Found HDF5 directory: $($hdf5_dir.FullName)"
            Write-Host "Contents of HDF5 directory:"
            Get-ChildItem $hdf5_dir.FullName | Select-Object Name, PSIsContainer | Format-Table -AutoSize

            # Move contents directly to avoid nesting
            if (-not (Test-Path "$env:USERPROFILE\hdf5")) {
              New-Item -Path "$env:USERPROFILE\hdf5" -ItemType Directory -Force | Out-Null
            }
            Get-ChildItem $hdf5_dir.FullName | Move-Item -Destination "$env:USERPROFILE\hdf5" -Force

            Write-Host "Contents installed to $env:USERPROFILE\hdf5:"
            Get-ChildItem "$env:USERPROFILE\hdf5" | Select-Object Name, PSIsContainer | Format-Table -AutoSize
          } else {
            Write-Host "ERROR: No HDF5 directory found in inner archive!"
            exit 1
          }
        } else {
          Write-Host "ERROR: No nested zip file found!"
          exit 1
        }

        # Verify installation
        if (-not (Test-Path "$env:USERPROFILE\hdf5\cmake")) {
          Write-Host "ERROR: HDF5 cmake directory not found after installation!"
          exit 1
        }
        if (-not (Test-Path "$env:USERPROFILE\hdf5\lib")) {
          Write-Host "ERROR: HDF5 lib directory not found after installation!"
          exit 1
        }
        Write-Host "HDF5 installation verified successfully"
      shell: pwsh

    - name: Configure CGNS
      run: |
        mkdir cbuild
        cd cbuild
        # Find Tcl/Tk library files dynamically (prefer non-stub versions)
        $tclLib = Get-ChildItem "$env:TCL_ROOT\lib" -Filter "tcl9*.lib" -Exclude "*stub*" | Select-Object -First 1 -ExpandProperty FullName
        if (-not $tclLib) {
          $tclLib = Get-ChildItem "$env:TCL_ROOT\lib" -Filter "tcl*.lib" | Select-Object -First 1 -ExpandProperty FullName
        }
        $tkLib = Get-ChildItem "$env:TK_ROOT\lib" -Filter "tk9*.lib" -Exclude "*stub*" | Select-Object -First 1 -ExpandProperty FullName
        if (-not $tkLib) {
          $tkLib = Get-ChildItem "$env:TK_ROOT\lib" -Filter "tk*.lib" | Select-Object -First 1 -ExpandProperty FullName
        }
        Write-Host "Using TCL_LIBRARY: $tclLib"
        Write-Host "Using TK_LIBRARY: $tkLib"

        # Manually find HDF5 paths - check for nested directory issue
        $hdf5Root = "$env:USERPROFILE\hdf5"

        Write-Host "Checking HDF5 installation:"
        if (Test-Path $hdf5Root) {
          Write-Host "  Found: $hdf5Root"
          Get-ChildItem $hdf5Root | Select-Object Name, PSIsContainer | Format-Table -AutoSize

          # Check if there's a nested hdf5 directory
          if (Test-Path "$hdf5Root\hdf5") {
            Write-Host "  Detected nested hdf5 directory, fixing..."
            $hdf5Root = "$hdf5Root\hdf5"
          }
        }

        $hdf5CmakeDir = "$hdf5Root\cmake"
        $hdf5IncludeDir = "$hdf5Root\include"
        $hdf5LibDir = "$hdf5Root\lib"

        Write-Host "Using HDF5 paths:"
        Write-Host "  HDF5_ROOT: $hdf5Root"

        # Check if directories exist
        if (Test-Path $hdf5Root) {
          Write-Host "  Contents:"
          Get-ChildItem $hdf5Root | Select-Object Name, PSIsContainer | Format-Table -AutoSize
        } else {
          Write-Host "  HDF5_ROOT does not exist - ERROR!"
        }

        Write-Host "  HDF5 cmake: $hdf5CmakeDir (exists: $(Test-Path $hdf5CmakeDir))"
        Write-Host "  HDF5 include: $hdf5IncludeDir (exists: $(Test-Path $hdf5IncludeDir))"
        Write-Host "  HDF5 lib: $hdf5LibDir (exists: $(Test-Path $hdf5LibDir))"

        if (Test-Path $hdf5LibDir) {
          Write-Host "  Contents of lib directory:"
          Get-ChildItem $hdf5LibDir | Select-Object Name | Format-Table -AutoSize
        }

        # Find the actual library file - try multiple patterns
        $hdf5Lib = $null
        if (Test-Path $hdf5LibDir) {
          $hdf5Lib = Get-ChildItem -Path $hdf5LibDir -Filter "hdf5.lib" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $hdf5Lib) {
            $hdf5Lib = Get-ChildItem -Path $hdf5LibDir -Filter "libhdf5.lib" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $hdf5Lib) {
            # Try any .lib file with hdf5 in the name
            $hdf5Lib = Get-ChildItem -Path $hdf5LibDir -Filter "*hdf5*.lib" -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
        }
        Write-Host "  HDF5 library: $hdf5Lib"

        # Configure with cgnstools enabled (we built Tcl/Tk from source with private headers)
        if (Test-Path $hdf5CmakeDir) {
          Write-Host "Using HDF5_DIR (cmake config)"
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCGNS_ENABLE_FORTRAN=OFF -DCGNS_ENABLE_HDF5=ON -DHDF5_DIR="$hdf5CmakeDir" -DHDF5_NEED_ZLIB=OFF -DHDF5_NEED_SZIP=OFF -DCGNS_BUILD_CGNSTOOLS=ON -DTCL_LIBRARY="$tclLib" -DTK_LIBRARY="$tkLib" -DTCL_INCLUDE_PATH="$env:TCL_ROOT\include" -DTK_INCLUDE_PATH="$env:TCL_ROOT\include" -DCGNS_ENABLE_TESTS=ON -DCMAKE_INSTALL_PREFIX=install ..
        } elseif ($hdf5Lib -and (Test-Path $hdf5IncludeDir)) {
          Write-Host "Using HDF5_INCLUDE_DIR and HDF5_LIBRARY (direct paths)"
          cmake -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release -DCGNS_ENABLE_FORTRAN=OFF -DCGNS_ENABLE_HDF5=ON -DHDF5_INCLUDE_DIR="$hdf5IncludeDir" -DHDF5_LIBRARY="$hdf5Lib" -DHDF5_NEED_ZLIB=OFF -DHDF5_NEED_SZIP=OFF -DCGNS_BUILD_CGNSTOOLS=ON -DTCL_LIBRARY="$tclLib" -DTK_LIBRARY="$tkLib" -DTCL_INCLUDE_PATH="$env:TCL_ROOT\include" -DTK_INCLUDE_PATH="$env:TCL_ROOT\include" -DCGNS_ENABLE_TESTS=ON -DCMAKE_INSTALL_PREFIX=install ..
        } else {
          Write-Host "ERROR: Cannot find HDF5 installation!"
          exit 1
        }
      shell: pwsh

    - name: Build CGNS
      run: |
        cd cbuild
        cmake --build . --config Release --parallel 4
      shell: pwsh

    - name: Verify CGNS Build
      run: |
        cd cbuild
        Write-Host "Checking CGNS library build:"
        if (Test-Path "src/Release/cgns.lib") {
          Write-Host "✓ CGNS static library built successfully"
        } else {
          Write-Host "✗ CGNS static library build failed"
          exit 1
        }
        if (Test-Path "src/Release/cgnsdll.dll") {
          Write-Host "✓ CGNS shared library built successfully"
        } else {
          Write-Host "✗ CGNS shared library build failed"
          exit 1
        }

        Write-Host "`nChecking cgnstools build:"
        if (Test-Path "src/cgnstools/cgnsview/Release/cgiowish.exe") {
          Write-Host "✓ cgnsview built successfully (tkogl.c compiled on Windows!)"
        } else {
          Write-Host "✗ cgnsview build failed"
          exit 1
        }
      shell: pwsh

    - name: Run Tests
      run: |
        cd cbuild
        ctest -C Release -VV --output-on-failure
      shell: pwsh

    - name: Install CGNS
      run: |
        cd cbuild
        cmake --install . --config Release
      shell: pwsh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cgns-windows-tools
        path: cbuild/install
