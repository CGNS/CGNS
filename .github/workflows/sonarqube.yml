name: SonarQube Analysis
on:
  workflow_run:
    workflows: ["SonarQube Build"]
    types: [completed]

env:
  BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory

jobs:
  sonarqube:
    name: SonarQube Scan
    runs-on: ubuntu-latest
    # Only scan when the build succeeded
    if: github.event.workflow_run.conclusion == 'success'
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io

    steps:
      - name: Checkout repository at triggering commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download SonarQube artifacts
        uses: actions/download-artifact@v4
        with:
          name: sonarqube-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Set SonarQube analysis parameters
        run: |
          if [ -f pr_number.txt ]; then
            echo "SONAR_EXTRA_ARGS=-Dsonar.pullrequest.key=$(cat pr_number.txt) \
              -Dsonar.pullrequest.branch=$(cat pr_head_ref.txt) \
              -Dsonar.pullrequest.base=$(cat pr_base_ref.txt)" >> $GITHUB_ENV
          else
            echo "SONAR_EXTRA_ARGS=-Dsonar.branch.name=${{ github.event.workflow_run.head_branch }}" >> $GITHUB_ENV
          fi

      - name: Set SonarQube analysis parameters
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "SONAR_EXTRA_ARGS=-Dsonar.pullrequest.key=${{ github.event.pull_request.number }} -Dsonar.pullrequest.branch=${{ github.event.pull_request.head.ref }} -Dsonar.pullrequest.base=${{ github.event.pull_request.base.ref }}" >> $GITHUB_ENV
          else
            echo "SONAR_EXTRA_ARGS=-Dsonar.branch.name=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Run SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            ${{ env.SONAR_EXTRA_ARGS }}
            -Dsonar.cfamily.compile-commands=cbuild/${{ env.BUILD_WRAPPER_OUT_DIR }}/compile_commands.json
            -Dsonar.coverageReportPaths=cbuild/coverage.xml
